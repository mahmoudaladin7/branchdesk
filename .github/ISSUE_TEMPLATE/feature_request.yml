name: Feature request
description: Suggest one focused improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the repeated problem and how you work around it today.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would help?
      description: A small example is more useful than a long feature list.
    validations:
      required: true
